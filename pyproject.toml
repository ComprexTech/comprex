[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "comprex"
version = "1.0.0"
description = "Enterprise AI Context Compressor — 15–20× semantic compression between corporate systems and OpenAI / LangChain."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Comprex" }]
keywords = ["llm", "context", "compression", "openai", "langchain", "fastapi", "tiktoken"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "tiktoken>=0.7",
  "pydantic>=2.6",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.2"]
openai = ["openai>=1.30"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
comprex = "llm_compressor.api:main"

[project.urls]
Homepage = "https://comprex.dev"
Documentation = "https://comprex.dev/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_compressor"]

[tool.hatch.build.targets.wheel.sources]
"src/llm_compressor" = "llm_compressor"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
